name: Eval

# Evaluation: Build AI Egocentric-10K clips + synthetic defects (including hand defects, #53),
# worker engine with the real hands model (MediaPipe Hand Landmarker), plus Gemini
# (cheapest Flash-Lite, free tier) when the GEMINI_API_KEY secret exists. The report is posted
# on issue #16. Start it from the Actions tab (workflow_dispatch) or by pushing a file under
# eval/requests/ to main. A request file may contain {"clips": N}; the default is 40.

on:
  workflow_dispatch:
    inputs:
      clips:
        description: Number of source clips to download from Egocentric-10K
        default: "40"
  push:
    branches: [main]
    paths:
      - "eval/requests/**"

concurrency:
  group: eval
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  eval:
    name: Eval (worker + Gemini)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: eval
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      # Optional. Without it the Gemini engine is skipped and the report says so.
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      QUELLIX_FINGERPRINT_DB: ${{ github.workspace }}/eval/out/fingerprints.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: System libraries for MediaPipe (hands model)
        working-directory: .
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libegl1 libgles2 libgl1
      - run: uv sync --extra data --extra gemini --extra hands
      - name: Hands model weights (sha256-checked, cached)
        uses: actions/cache@v4
        with:
          path: ~/.cache/quellix/hands
          key: hands-landmarker-fbc2a300
      - run: uv run python -m quellix_hands.weights download
      - name: Decide how many clips
        id: n
        env:
          INPUT_CLIPS: ${{ inputs.clips }}
        run: |
          clips="${INPUT_CLIPS:-}"
          if [ -z "$clips" ]; then
            # The request file(s) added or changed by this push (not the oldest file on disk).
            req="$(git diff --name-only --diff-filter=AM HEAD^ HEAD -- ../eval/requests | tail -n 1 || true)"
            if [ -n "$req" ] && [ -f "../$req" ]; then
              clips="$(python3 -c "import json,sys; print(json.load(open(sys.argv[1])).get('clips', ''))" "../$req")"
            fi
          fi
          clips="${clips:-40}"
          case "$clips" in ''|*[!0-9]*) echo "clips must be a positive integer, got '$clips'" >&2; exit 1;; esac
          echo "clips=$clips" >> "$GITHUB_OUTPUT"
      - name: Run evaluation
        run: |
          mkdir -p out
          uv run python -m quellix_eval.ci --clips "${{ steps.n.outputs.clips }}" --out-dir out
      - name: Post the report on issue #16
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f out/report.md ]; then
            head -c 60000 out/report.md > out/comment.md
            gh issue comment 16 -R "${{ github.repository }}" --body-file out/comment.md
          else
            gh issue comment 16 -R "${{ github.repository }}" --body "Eval run ${{ github.run_id }} produced no report.md."
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          if-no-files-found: warn
          path: |
            eval/out/report.md
            eval/out/manifest.jsonl
            eval/out/sources.jsonl
