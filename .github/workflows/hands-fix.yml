name: Hands fix

# Issue #4: the hands check was too strict. Diagnoses and scores it on real data:
# - overlays of HoloAssist's projected hand joints next to the model's own decision on the same
#   frame (are the labels right? what does the model do?);
# - the detector threshold chosen on HoloAssist *train* windows, then the benchmark's hands slice
#   (validation windows, same seed) and the synthetic hands slice scored once, before (hands@0.1.0)
#   and after, both error types with CIs;
# - the landing clips and the third-person Pexels clips (measured values, no labels).
# Run from the Actions tab, or push eval/requests/hands-fix.json to the agent/hands-fix branch.
# On a branch other than main, the report and the overlays are committed back to the branch.

on:
  workflow_dispatch:
    inputs:
      dev_sessions:
        description: HoloAssist train-split sessions for the threshold choice
        default: "60"
      val_sessions:
        description: HoloAssist validation sessions to score (benchmark v2 uses 130)
        default: "130"
      synthetic_sources:
        description: Egocentric-10K source clips for the synthetic hands slice (0 = skip)
        default: "40"
  push:
    branches: [agent/hands-fix]
    paths:
      - "eval/requests/hands-fix.json"

concurrency:
  group: hands-fix
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  score:
    name: Diagnose and score the hands check
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults:
      run:
        working-directory: eval
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      QUELLIX_HOLO_CACHE: ${{ github.workspace }}/eval/out/holo-cache
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: System libraries for MediaPipe
        working-directory: .
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libegl1 libgles2 libgl1
      - run: uv sync --extra data --extra hands
      - uses: actions/cache@v4
        with:
          path: ~/.cache/quellix/hands
          key: hands-landmarker-fbc2a300
      - run: uv run python -m quellix_hands.weights download
      - name: HoloAssist tar indexes (cached; walking them takes minutes)
        uses: actions/cache@v4
        with:
          path: eval/out/holo-cache
          key: holoassist-index-v1-hands
          restore-keys: holoassist-index-v1-
      - name: Sizes
        id: n
        env:
          IN_DEV: ${{ inputs.dev_sessions }}
          IN_VAL: ${{ inputs.val_sessions }}
          IN_SYN: ${{ inputs.synthetic_sources }}
        run: |
          get() { [ -f requests/hands-fix.json ] && python3 -c "import json,sys; print(json.load(open('requests/hands-fix.json')).get(sys.argv[1], ''))" "$1" || true; }
          dev="${IN_DEV:-$(get dev_sessions)}"; val="${IN_VAL:-$(get val_sessions)}"; syn="${IN_SYN:-$(get synthetic_sources)}"
          dev="${dev:-60}"; val="${val:-130}"; syn="${syn:-40}"
          case "$dev$val$syn" in ''|*[!0-9]*) echo "sizes must be integers" >&2; exit 1;; esac
          echo "dev=$dev" >> "$GITHUB_OUTPUT"; echo "val=$val" >> "$GITHUB_OUTPUT"; echo "syn=$syn" >> "$GITHUB_OUTPUT"
      - name: Score
        run: |
          mkdir -p out/hands
          set -o pipefail
          uv run python -m quellix_eval.hands_score --out out/hands --pexels \
            --dev-sessions "${{ steps.n.outputs.dev }}" --val-sessions "${{ steps.n.outputs.val }}" \
            --synthetic-sources "${{ steps.n.outputs.syn }}" 2>&1 | tee out/hands/run.log
      - name: Post the report on issue #4
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f out/hands/report.md ]; then
            { echo "Hands fix run ${{ github.run_id }} on \`${{ github.ref_name }}\`."; echo; cat out/hands/report.md; } > out/comment.md
          else
            {
              echo "Hands fix run ${{ github.run_id }} on \`${{ github.ref_name }}\` **failed in the Score step** and produced no report."
              echo; echo "Last lines of its output (warnings from the detector library removed):"; echo
              echo '```'; grep -v -E "^(W0000|INFO:|WARNING: Logging)" out/hands/run.log 2>/dev/null | tail -n 40 || echo "(no log)"; echo '```'
              echo; echo "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            } > out/comment.md
          fi
          head -c 60000 out/comment.md > out/comment-trimmed.md
          gh issue comment 4 -R "${{ github.repository }}" --body-file out/comment-trimmed.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hands-fix
          if-no-files-found: warn
          path: |
            eval/out/hands/report.md
            eval/out/hands/run.log
            eval/out/hands/scored.json
            eval/out/hands/debug
            eval/out/hands/overlays
      - name: Commit the report and overlays to this branch
        if: success() && github.ref != 'refs/heads/main'
        working-directory: .
        run: |
          d=eval/reports/hands-diagnosis/holoassist
          mkdir -p "$d"
          cp eval/out/hands/report.md eval/reports/hands-score.md
          cp eval/out/hands/scored.json eval/reports/hands-score.json
          # pairs for the same session: the projected labels, and the model on the same window
          n=0
          for f in eval/out/hands/debug/*.jpg; do
            [ -e "$f" ] || continue
            s="$(basename "$f" .jpg)"; m="eval/out/hands/overlays/holo_hands_${s}-model.jpg"
            [ -f "$m" ] || continue
            cp "$f" "$d/${s}-projection.jpg"; cp "$m" "$d/${s}-model.jpg"
            n=$((n+1)); [ "$n" -ge 8 ] && break
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -f eval/reports/hands-score.md eval/reports/hands-score.json "$d"
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "eval: hands fix report and HoloAssist overlays (run ${{ github.run_id }})"
          git pull --rebase origin "${{ github.ref_name }}" || true
          git push origin "HEAD:${{ github.ref_name }}"
