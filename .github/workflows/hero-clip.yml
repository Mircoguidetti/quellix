name: Hero clip

# The landing hero clip chosen by the founder (#87): one Pexels pick cut to its best 9 s,
# encoded as mp4 / webm / poster, checked by the worker, with a site-clip sidecar carrying the
# per-frame hand boxes. Commits apps/web/public/media/clips/<name>.* to agent/hero-candidates.
# Run it from the Actions tab, or push eval/hero-clip-request.json to agent/hero-candidates.

on:
  workflow_dispatch:
    inputs:
      pexels_id: {description: "Pexels video id", default: "11142458"}
      name: {description: "Output name", default: "hero-lemons"}
  push:
    branches: [agent/hero-candidates]
    paths: ["eval/hero-clip-request.json"]

concurrency:
  group: hero-clip
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  clip:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: eval
    env:
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PEXELS_ID: ${{ inputs.pexels_id || '11142458' }}
      CLIP_NAME: ${{ inputs.name || 'hero-lemons' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: System libraries for MediaPipe
        working-directory: .
        run: sudo apt-get update -q && sudo apt-get install -y -q libegl1 libgles2 libgl1
      - run: uv sync --extra data --extra mediapipe
      - name: Hands model weights
        run: uv run python -m quellix_hands.weights download
      - name: Cut, encode, check, sidecar
        run: |
          uv run python -m quellix_eval.hero clip --pexels-id "$PEXELS_ID" --name "$CLIP_NAME" \
            --out out/hero-clip --final-dir ../apps/web/public/media/clips
      - name: Commit the clip to this branch
        if: success() && github.ref != 'refs/heads/main'
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/public/media/clips/"$CLIP_NAME".*
          git diff --cached --stat
          if ! git diff --cached --quiet; then
            git commit -q -m "web: hero clip $CLIP_NAME from Pexels $PEXELS_ID (run ${{ github.run_id }})"
            for i in 1 2 3 4; do
              git pull -q --rebase origin "${{ github.ref_name }}" && \
                git push -q origin "HEAD:${{ github.ref_name }}" && break
              sleep $((i * 5))
            done
          fi
