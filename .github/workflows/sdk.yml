name: SDK

on:
  push:
    branches: [main]
    paths:
      - "packages/sdk-ts/**"
      - "packages/sdk-python/**"
      - "packages/contracts/**"
      - ".github/workflows/sdk.yml"
  pull_request:
    paths:
      - "packages/sdk-ts/**"
      - "packages/sdk-python/**"
      - "packages/contracts/**"
      - ".github/workflows/sdk.yml"

concurrency:
  group: sdk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sdk-ts
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @ormes/sdk...
        working-directory: .
      - name: Generated types are up to date
        run: pnpm check:generated
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  python:
    name: Python SDK (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: packages/sdk-python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync
      - name: Generated models are up to date
        run: |
          ./scripts/generate.sh
          git diff --exit-code -- src/ormes/_generated
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest -q
      - run: uv build
