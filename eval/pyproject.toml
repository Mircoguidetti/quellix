[project]
name = "quellix-eval"
version = "0.1.0"
description = "Ormes evaluation: datasets, synthetic defects, metrics, baseline comparisons."
requires-python = ">=3.12"
dependencies = [
  "quellix-worker",
  "quellix-hands",
  "pydantic>=2.7",
  "av>=13",
  "numpy>=2",
  "opencv-python-headless>=4.10",
]

[project.optional-dependencies]
# Only needed on the machine that downloads datasets / calls the baselines.
data = ["huggingface-hub>=0.25"]
gemini = ["google-genai>=1"]
twelvelabs = ["twelvelabs>=0.4"]
# The real hands detector (needs libegl1 / libgles2 on Linux), for the site-clips job.
mediapipe = ["quellix-hands[mediapipe]"]

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.7",
]

[tool.uv.sources]
quellix-worker = { path = "../services/worker", editable = true }
quellix-hands = { path = "../models/hands", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quellix_eval"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
