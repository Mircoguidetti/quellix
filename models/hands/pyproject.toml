[project]
name = "quellix-hands"
version = "0.1.0"
description = "Ormes hands model: per-frame hand visibility, truncation, contact and manipulation segments."
requires-python = ">=3.12"
dependencies = [
  "numpy>=2",
]

[project.optional-dependencies]
# The v0 detector. Optional so the worker can import the package without it.
mediapipe = ["mediapipe>=0.10.20"]
# Decoding videos for the evaluation hook.
eval = ["av>=13"]

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.7",
  "av>=13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quellix_hands"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
