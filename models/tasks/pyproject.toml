[project]
name = "quellix-tasks"
version = "0.1.0"
description = "Task-completion models (task library): steps, final state, completed / not / unsure."
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.5.4",
  # Reused, never edited from here: frame decoding, CheckOutput, rubric.evaluate (the only
  # place that turns measurements into a decision) and the general-model judges (teacher).
  "quellix-worker",
]

[project.scripts]
# Dash-free entry point, so eval can call it with `--worker-cmd <path>/quellix-tasks`.
quellix-tasks = "quellix_tasks.__main__:cli"

[project.optional-dependencies]
# SigLIP 2 frame/text encoder (Apache-2.0). Not needed for tests.
embed = [
  "torch>=2.14.1",
  "transformers>=5.20.2",
]

[tool.uv.sources]
quellix-worker = { path = "../../services/worker", editable = true }

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quellix_tasks"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
