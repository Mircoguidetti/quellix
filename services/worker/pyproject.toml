[project]
name = "quellix-worker"
version = "0.1.0"
description = "Ormes video pipeline: checks, rubric evaluation, decision."
requires-python = ">=3.12"
dependencies = [
  "av>=19.0.2",
  "httpx>=0.28.1",
  "jsonschema>=4.23",
  "numpy>=2.5.4",
  "opencv-python-headless>=5.0.0.93",
  "pdqhash>=0.2.8",
]

[project.optional-dependencies]
modal = [
    "modal>=1.6.2",
]
embed = [
    "torch>=2.14.1",
    "transformers>=5.20.2",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "quellix-hands",
  "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quellix_worker"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
quellix-hands = { path = "../../models/hands", editable = true }
