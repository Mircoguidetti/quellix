[project]
name = "quellix-worker"
version = "0.1.0"
description = "Quellix video pipeline: checks, rubric evaluation, decision."
requires-python = ">=3.12"
dependencies = [
  "jsonschema>=4.23",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quellix_worker"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
